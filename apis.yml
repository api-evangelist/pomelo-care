name: Pomelo Care
description: >-
  Pomelo Care is a value-based virtual healthcare company delivering 24/7
  clinician-led care for women and children across fertility and preconception,
  prenatal and postpartum, pediatric and NICU, and midlife and menopause health.
  Operating as a telehealth platform contracted with employers and health plans,
  Pomelo pairs licensed clinicians, doulas, and care teams with remote monitoring
  to close the gaps between doctor visits, reduce NICU admissions, and improve
  maternal and infant outcomes. The company reports covering 25 million lives
  across all 50 states and raised a $92M Series C at a $1.7B valuation. Pomelo
  Care is a patient-, employer-, and payer-facing platform and does not currently
  publish a public developer API, SDK, or developer portal; it was surfaced as a
  portfolio company of a16z and First Round Capital and profiled in the API
  Evangelist network for company-level discovery and monitoring.
